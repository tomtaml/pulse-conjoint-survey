<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title desc"><title id="title">Automated positioning is a separate function</title><desc id="desc">A vehicle moves into a defined position in a suitable parking area. A user stop control remains available. This diagram does not authorise energy export.</desc><rect width="720" height="220" rx="16" fill="#f0f5ed"/><path d="M358 55h147v112H358" stroke="#a1b6a3" fill="none" stroke-width="3"/><rect x="375" y="74" width="100" height="73" rx="14" fill="#fff" stroke="#306b5d" stroke-width="3"/><rect x="235" y="74" width="100" height="73" rx="14" fill="#e0e9df" stroke="#86a38c" stroke-width="2" stroke-dasharray="7 5"/><path d="M302 110h57m-11-8 11 8-11 8" fill="none" stroke="#b2823c" stroke-width="3"/><rect x="544" y="84" width="89" height="47" rx="9" fill="#fff" stroke="#a27536" stroke-width="2"/><text x="588" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#91662d">STOP</text><text x="360" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#294d43">Authorised movement into a defined position</text><text x="360" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#557365">Positioning, charging and energy export are separate functions</text></svg>
