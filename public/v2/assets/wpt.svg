<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title desc"><title id="title">Stationary wireless charging</title><desc id="desc">A compatible vehicle is parked over compatible charging equipment. Electricity transfers from the pad to the vehicle. Positioning is a separate step.</desc><rect width="720" height="220" rx="16" fill="#f0f5ed"/><path d="M70 162h580" stroke="#bdcebd" stroke-width="2"/><path d="M213 124v-26l28-31h174l42 31h23v26z" fill="#fff" stroke="#306b5d" stroke-width="3"/><path d="M254 75h64v25h-84zm76 0h75l31 25H330z" fill="#dce9df"/><circle cx="257" cy="129" r="17" fill="#284c43"/><circle cx="430" cy="129" r="17" fill="#284c43"/><rect x="304" y="150" width="104" height="12" rx="6" fill="#9cb6a0"/><path d="M335 148q-8-11 0-21m21 21q-8-11 0-21m21 21q-8-11 0-21" fill="none" stroke="#b77a2e" stroke-width="3"/><text x="360" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#294d43">Parked and aligned. No cable connection.</text><text x="360" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#557365">Compatible vehicle + compatible charging equipment</text></svg>
