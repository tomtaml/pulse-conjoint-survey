			<ns0:text x="35" y="822.0" style="font-family: Helvetica; font-size: 13px;fill: rgb(31%,41%,37%); stroke:none;" transform="translate(0,1644) scale(1,-1)">Powertrain gates actual charging experience. A household or realistic future role supports service evaluation.</ns0:text>
