<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Private PULSE Version A survey walkthrough for reviewing respondent flow, timing and wording.">
  <meta name="theme-color" content="#f4f6f2">
  <title>PULSE · Version A survey walkthrough</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to question</a>
  <header class="header">
    <div class="brand"><span class="brand-icon" aria-hidden="true">P</span><div>PULSE<small>Citizen survey</small></div></div>
    <div class="header-right"><span class="draft-badge"><i aria-hidden="true"></i>Private draft walkthrough</span><button id="comment-button" class="quiet" hidden>Comment on this screen</button></div>
  </header>
  <div class="test-strip">For flow and wording review · test answers stay in this browser tab · collection is off</div>
  <div id="progress-area"></div>
  <main id="main" tabindex="-1"><div class="loading" role="status">Loading the survey…</div></main>
  <aside id="comment-panel" class="comment-panel" aria-label="Comment on this screen" hidden></aside>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <footer><span>PULSE WP1</span><span>Version A · working draft 0.2 · 2 November 2026</span><span>English walkthrough</span></footer>
</body>
</html>
